    <script>
      // Safeguard against third-party scripts (AdSense, GTM, polyfills) attempting to set window.fetch
      // in sandboxed iframe environments where fetch has only a getter by default.
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch || originalFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Property may be non-configurable in some sandbox environments
        }

        // Catch and prevent unhandled getter errors from crashing page execution
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        });
      })();
    </script>
